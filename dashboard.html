<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡系統</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Start WORK!!!</h1>
    
    <h2>Scan QR Code to check in:</h2>
    <video id="preview" width="400" height="300"></video>
    <p id="status"></p>

    <script>
        let scanner = new ZXing.BrowserQRCodeReader();
    
        function startScan() {
            scanner.decodeFromVideoDevice(null, 'preview', (result, err) => {
                if (result) {
                    let emp_id = result.text.trim();  // 確保去除空格
                    console.log("✅ QR Code 掃描成功：", emp_id);
                    scanner.reset(); // 停止掃描，避免重複提交
                    send(emp_id);
                    alert("✅ 打卡成功!");
                }
            });
        }
    
        function send(emp_id) {
            let formData = new URLSearchParams();
            formData.append("ID", emp_id);

            console.log("📤 送出請求 ID:", emp_id); // Debug 用

            fetch("http://localhost/IoT/late.php", {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(response => {
                return response.json();
            })
            .then(data => {
                console.log(data)
            })
            .catch(error => {
                console.error("❌ 網絡請求失敗:", error);
            });
        }
    
        document.addEventListener("DOMContentLoaded", startScan);
    </script>    
    
    
</body>
</html>
