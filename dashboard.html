<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡系統</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Start WORK!!!</h1>
    
    <h2>Scan QR Code to check in:</h2>
    <video id="preview" width="400" height="300"></video>
    <p id="status"></p>

    <script>
        // 確保使用者已登入
        // let emp_id = sessionStorage.getItem("emp_id");
        // if (!emp_id) {
        //     window.location.href = "login.html";
        // }

        let scanner = new ZXing.BrowserQRCodeReader();
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxcIkbdEaumzcqyyAKeT2PiC3l0yhoF2FC6zG7WrNyakuCIkLwpmiBDdLwPW6BhUzoPxA/exec";  // 替換為你的 Google Apps Script 網址

        function startScan() {
            scanner.decodeFromVideoDevice(null, 'preview', (result, err) => {
                if (result) {
                    let qr_code_data = result.text;
                    sendToGoogleSheets(emp_id, qr_code_data);
                    scanner.reset(); // 掃描成功後停止
                }
            });
        }

        function sendToGoogleSheets(emp_id, qr_code_data) {
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ emp_id: emp_id, qr_data: qr_code_data, status: '上班' })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("status").innerText = data.message;
            })
            .catch(error => console.error('Error:', error));
        }

        // 自動開始掃描
        startScan();
    </script>
</body>
</html>
