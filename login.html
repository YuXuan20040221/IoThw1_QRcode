<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <form id="login-form">
        <h2>★ 員工登入 ★</h2>
        帳號
        <input type="text" id="username" required><br>
        密碼
        <input type="password" id="password" required><br>
        <button type="submit">登入</button>
    </form>

    <script>
        document.getElementById("login-form").addEventListener("submit", function(event) {
            event.preventDefault();
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            fetch('http://localhost/IoT/login.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `username=${username}&password=${password}`
            })
            .then(response => response.json())  // 解析 JSON 回應
            .then(data => {
                console.log(data);  // 顯示伺服器回應內容，方便排查
                if (data.success) {
                    sessionStorage.setItem("emp_id", data.ID);  // 使用ID而不是username
                    window.location.href = "main.html";
                } else {
                    document.getElementById("message").innerText = data.message || "登入失敗";
                }
            })
            .catch(error => {
                console.error('錯誤:', error);
            });
        });
    </script>        
</body>
</html>
