<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>出勤紀錄</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="calendar.css">
    <script src="calender.js"></script>
</head>
<body>
    <!-- 上方bar -->
    <div class="navbar">
        <span>員工編號: <strong id="employeeId">12345</strong></span>
        <button id="logoutBtn" onclick="logout()">登出</button>
    </div>

    <!-- 日曆 -->
    <div class="calendar">
        <div class="header">
            <button class="prev-month"><</button>
            <span class="month-title"></span>
            <button class="next-month">></button>
        </div>
        <div class="weekdays">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="days">
        </div>
    </div>

    <script>
        function logout(){
            window.location.href="login.html";
        }
        let empId = sessionStorage.getItem("emp_id");
        if (empId) {
            console.log("登入的使用者 ID:", empId);
            // 可以在這裡進行其他操作，比如顯示在頁面上
            document.getElementById("employeeId").innerText = empId;
        } else {
            console.log("沒有找到登入的使用者 ID");
        }
    </script>
</body>
</html>
